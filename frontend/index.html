<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吉信德企业门户</title>
<style>
  :root {
    --blue: #2f6ef4;
    --blue-dk: #2559cf;
    --blue-bg: #e8f1fd;
    --ink: #2a3a5c;
    --ink-strong: #1d2f4e;
    --dim: #71809c;
    --star: #f5a623;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
    /* 渐变画布：浅蓝为主，右上一点微暖粉紫晕 */
    background:
      radial-gradient(900px 420px at 88% 0%, rgba(246, 226, 234, .55), transparent 60%),
      linear-gradient(115deg, #cfe1f8 0%, #dce8fb 40%, #e7edfb 100%);
    min-height: 100vh; color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; border: none; cursor: pointer; background: none; }
  svg { flex: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ── 顶栏：与背景一体，轻磨砂 ── */
  .top {
    background: rgba(233, 240, 251, .55);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    height: 64px; display: flex; align-items: center; gap: 26px;
    padding: 0 26px; position: sticky; top: 0; z-index: 30;
  }
  .logo { display: flex; align-items: center; gap: 11px; flex: none; }
  .logo .mk {
    width: 40px; height: 40px; border-radius: 11px; color: #fff; font-size: 19px; font-weight: 800;
    background: linear-gradient(140deg, #5793f8, #2e6ae8); display: grid; place-items: center;
  }
  .logo b { font-size: 17px; letter-spacing: .02em; color: var(--ink-strong); }
  .logo small { display: block; font-size: 10.5px; color: var(--dim); letter-spacing: .12em; margin-top: 2px; font-weight: 400; }
  .search {
    flex: 1; max-width: 560px; display: flex; align-items: center; gap: 10px;
    background: #fff; border-radius: 999px; padding: 11px 20px;
    box-shadow: 0 2px 10px rgba(61, 98, 176, .08);
  }
  .search input {
    flex: 1; border: none; outline: none; background: none; font-family: inherit;
    font-size: 13.5px; color: var(--ink);
  }
  .search input::placeholder { color: #9fadc4; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 22px; }

  /* 用户区（规范固定件：头像 + 下拉菜单 + 退出登录） */
  .user-area { position: relative; }
  .avatar-btn {
    width: 36px; height: 36px; border-radius: 50%; cursor: pointer; overflow: hidden;
    background: linear-gradient(140deg, #5793f8, #2e6ae8); color: #fff;
    display: grid; place-items: center; font-size: 13px; font-weight: 600;
    border: 2px solid #fff; box-shadow: 0 2px 8px rgba(61, 98, 176, .18);
    transition: box-shadow .15s;
  }
  .avatar-btn:hover { box-shadow: 0 0 0 2px var(--blue); }
  .avatar-btn img { width: 100%; height: 100%; object-fit: cover; }
  .user-menu {
    position: absolute; right: 0; top: 48px; min-width: 230px;
    background: #fff; border-radius: 14px; padding: 6px;
    box-shadow: 0 14px 40px rgba(29, 47, 78, .16);
    display: none; z-index: 40;
  }
  .user-menu.open { display: block; }
  .user-menu .who { padding: 12px 14px 10px; border-bottom: 1px solid #eef3fa; }
  .user-menu .who .name { font-size: 14px; font-weight: 650; color: var(--ink-strong); }
  .user-menu .who .email { font-size: 12px; color: var(--dim); margin-top: 3px; word-break: break-all; }
  .user-menu .who .roles { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; }
  .role-chip {
    font-size: 11px; padding: 2px 9px; border-radius: 4px; font-weight: 600;
    background: var(--blue-bg); color: var(--blue);
  }
  .menu-item {
    display: block; width: 100%; text-align: left;
    padding: 10px 14px; margin-top: 4px; border-radius: 8px;
    color: #e0455a; font-size: 13px;
  }
  .menu-item:hover { background: #fdeef0; }

  /* ── 布局：侧边栏与背景一体 ── */
  .layout { display: flex; min-height: calc(100vh - 64px); }
  .side {
    width: 200px; flex: none;
    padding: 18px 14px 22px; display: flex; flex-direction: column; gap: 3px;
    position: sticky; top: 64px; height: calc(100vh - 64px); overflow-y: auto;
  }
  .nav {
    display: flex; align-items: center; gap: 11px; padding: 12px 14px; border-radius: 11px;
    font-size: 14px; color: #40506f; transition: all .15s; position: relative;
    width: 100%; text-align: left; flex: none;
  }
  .nav:hover { color: var(--blue); background: rgba(255, 255, 255, .5); }
  .nav.on {
    background: #fff; color: var(--blue); font-weight: 600;
    box-shadow: 0 6px 18px rgba(61, 98, 176, .14);
  }
  .nav .ct { margin-left: auto; font-size: 11px; color: #93a1bc; font-weight: 400; }
  .nav.on .ct { color: var(--blue); }
  .side-card {
    margin-top: auto; border-radius: 14px; padding: 15px 14px; position: relative; overflow: hidden;
    background: linear-gradient(145deg, #4a8cf5 0%, #2e63e2 100%); color: #fff;
    box-shadow: 0 10px 26px rgba(46, 99, 226, .28);
  }
  .side-card::after {
    content: "🐾"; position: absolute; right: -6px; bottom: -10px; font-size: 54px; opacity: .22;
  }
  .side-card .t { font-size: 13px; font-weight: 650; position: relative; }
  .side-card p { font-size: 11.5px; opacity: .88; margin-top: 7px; line-height: 1.6; position: relative; }

  /* ── 内容区 ── */
  .main { flex: 1; min-width: 0; position: relative; }
  /* 背景宠物元素：一串爪印从右上角"走进"页面 + 一根小骨头 */
  .decor { position: absolute; pointer-events: none; user-select: none; color: rgba(255, 255, 255, .62); z-index: 0; }
  .decor.p1 { top: 10px;  right: 34px;  width: 30px; transform: rotate(-118deg); }
  .decor.p2 { top: 54px;  right: 92px;  width: 27px; transform: rotate(-132deg); color: rgba(255, 255, 255, .55); }
  .decor.p3 { top: 26px;  right: 148px; width: 24px; transform: rotate(-115deg); color: rgba(255, 255, 255, .48); }
  .decor.p4 { top: 72px;  right: 204px; width: 21px; transform: rotate(-130deg); color: rgba(255, 255, 255, .4); }
  .decor.bone { top: 108px; right: 48px; width: 46px; transform: rotate(24deg); color: rgba(255, 255, 255, .45); }
  @media (max-width: 900px) { .decor { display: none; } }

  .wrap { padding: 26px 26px 30px 14px; position: relative; z-index: 1; }
  .page-h { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 2px 4px 4px; }
  .page-h h1 { font-size: 21px; font-weight: 700; color: var(--ink-strong); }
  .page-h .sub { font-size: 12.5px; color: #5d6d8c; }
  /* 品牌徽章：小巧的白色胶囊 */
  .brand-pill {
    margin-left: auto; display: inline-flex; align-items: center; gap: 7px;
    background: #fff; border-radius: 999px; padding: 7px 15px;
    font-size: 10.5px; font-weight: 700; letter-spacing: .22em; color: #3d5480;
    box-shadow: 0 4px 14px rgba(61, 98, 176, .12);
  }
  .brand-pill svg { width: 13px; color: var(--blue); }

  /* 横幅公告条 */
  .banners { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .banner {
    display: flex; align-items: center; gap: 10px;
    background: #fff; border-left: 4px solid var(--blue); border-radius: 10px;
    padding: 11px 14px; font-size: 13px; color: #33425f;
    box-shadow: 0 2px 10px rgba(61, 98, 176, .08);
  }
  .banner.warning { border-left-color: #f5a623; }
  .banner .bic { flex: none; }
  .banner .bx {
    margin-left: auto; color: #9aa7c0; font-size: 15px; line-height: 1;
    padding: 2px 6px; border-radius: 6px; flex: none;
  }
  .banner .bx:hover { color: #e0455a; background: #fdeef0; }

  /* 悬浮模块卡：纯白、软投影、无边框 */
  .card {
    margin-top: 16px; background: #fff; border-radius: 16px;
    box-shadow: 0 2px 6px rgba(61, 98, 176, .05), 0 12px 32px rgba(61, 98, 176, .10);
  }
  .card-h {
    display: flex; align-items: center; gap: 10px;
    padding: 18px 22px 4px; font-size: 15px; font-weight: 700; color: var(--ink-strong);
  }
  .card-h .hic {
    width: 24px; height: 24px; border-radius: 7px; flex: none;
    background: var(--blue-bg); color: var(--blue);
    display: grid; place-items: center;
  }
  .card-h .ct { font-size: 12px; color: var(--dim); font-weight: 400; }

  /* 应用磁贴：模块卡内的浅蓝底小卡 */
  .agrid {
    display: grid; gap: 13px; padding: 14px 22px 22px;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  }
  .acard {
    display: flex; align-items: center; gap: 14px; position: relative;
    background: #f4f8fd; border: 1px solid #eaf1fa; border-radius: 12px; padding: 17px 16px;
    transition: all .18s;
  }
  .acard:hover {
    background: #fff; transform: translateY(-3px); border-color: #c4d8f8;
    box-shadow: 0 12px 26px rgba(47, 110, 244, .14);
  }
  .acard .ic {
    width: 48px; height: 48px; border-radius: 13px; font-size: 23px; color: #fff;
    display: grid; place-items: center; flex: none;
  }
  .acard .ic img { width: 26px; height: 26px; object-fit: contain; }
  .acard b { display: block; font-size: 14.5px; font-weight: 650; color: var(--ink-strong); padding-right: 20px; }
  .acard span { display: block; font-size: 12px; color: var(--dim); margin-top: 5px; line-height: 1.5; }
  .acard .maint {
    display: inline-block; font-style: normal; font-size: 10.5px; font-weight: 600;
    color: #c2701a; background: #fff3e0; border-radius: 999px; padding: 2px 8px;
    margin-left: 7px; vertical-align: 1px;
  }
  .acard .owner-line { font-size: 11px; color: #93a1bc; margin-top: 4px; }
  .acard .ar {
    position: absolute; right: 14px; bottom: 14px; transform: translateX(-4px);
    color: var(--blue); font-size: 15px; opacity: 0; transition: all .18s;
  }
  .acard:hover .ar { opacity: 1; transform: none; }
  /* 星标收藏：右上角，悬停或已收藏时可见 */
  .fav-btn {
    position: absolute; top: 8px; right: 10px; font-size: 15px; line-height: 1;
    color: #b8c5dc; opacity: 0; transition: all .15s; padding: 3px;
  }
  .acard:hover .fav-btn { opacity: 1; }
  .fav-btn:hover { transform: scale(1.25); color: var(--star); }
  .fav-btn.faved { opacity: 1; color: var(--star); }

  .empty { padding: 40px 0 46px; text-align: center; color: var(--dim); font-size: 13px; line-height: 1.8; }
  .empty .big { font-size: 36px; margin-bottom: 10px; }

  /* 骨架屏 */
  .skeleton {
    height: 84px; border-radius: 12px; border: 1px solid #eaf1fa;
    background: linear-gradient(100deg, #f4f8fd 40%, #ecf2fa 50%, #f4f8fd 60%);
    background-size: 200% 100%; animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .pagefoot { text-align: center; font-size: 11.5px; color: #6d7d9c; padding: 26px 0 2px; letter-spacing: .06em; }

  @media (max-width: 780px) {
    .side { display: none; }
    .top { padding: 0 14px; gap: 14px; }
    .logo small { display: none; }
    .wrap { padding: 16px 14px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="logo">
    <span class="mk">吉</span>
    <div><b>吉信德企业门户</b><small>AMAZON · PETSFIT</small></div>
  </div>
  <div class="search">🔍<input id="q" placeholder="搜索应用名称…"></div>
  <div class="top-right">
    <div class="user-area" id="userArea">
      <button class="avatar-btn" id="avatarBtn" title="账户">…</button>
      <div class="user-menu" id="userMenu">
        <div class="who">
          <div class="name" id="menuName">识别中</div>
          <div class="email" id="menuEmail"></div>
          <div class="roles" id="menuRoles"></div>
        </div>
        <button class="menu-item" id="logoutBtn">退出登录</button>
      </div>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="side">
    <a class="nav" id="navWork" href="#workbench">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 7.5 8 2l6 5.5V14H2z"/><path d="M6 14v-4h4v4"/></svg>
      个人工作台
    </a>
    <a class="nav" id="navApps" href="#apps">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
      全部应用<span class="ct" id="allCt"></span>
    </a>
    <a class="nav" id="sideAdminLink" href="/admin" style="display:none">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M13 8c0-.4 0-.8-.1-1.1l1.4-1-1.2-2.1-1.6.6c-.6-.5-1.2-.9-2-1.1L9.2 1.6H6.8l-.3 1.7c-.8.2-1.4.6-2 1.1l-1.6-.6-1.2 2.1 1.4 1c-.1.3-.1.7-.1 1.1s0 .8.1 1.1l-1.4 1 1.2 2.1 1.6-.6c.6.5 1.2.9 2 1.1l.3 1.7h2.4l.3-1.7c.8-.2 1.4-.6 2-1.1l1.6.6 1.2-2.1-1.4-1c.1-.3.1-.7.1-1.1z"/></svg>
      管理后台
    </a>
    <div class="side-card">
      <div class="t">没有你需要的应用？</div>
      <p>入口按你的角色权限展示，如需访问其他系统请联系管理员开通</p>
    </div>
  </aside>

  <div class="main">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="pawprint" viewBox="0 0 100 100">
        <ellipse cx="50" cy="66" rx="21" ry="16" fill="currentColor"/>
        <ellipse cx="25" cy="40" rx="8.5" ry="11" fill="currentColor" transform="rotate(-22 25 40)"/>
        <ellipse cx="42" cy="30" rx="8.5" ry="11" fill="currentColor" transform="rotate(-7 42 30)"/>
        <ellipse cx="59" cy="30" rx="8.5" ry="11" fill="currentColor" transform="rotate(8 59 30)"/>
        <ellipse cx="76" cy="41" rx="8.5" ry="11" fill="currentColor" transform="rotate(24 76 41)"/>
      </symbol>
      <symbol id="bone" viewBox="0 0 100 60">
        <rect x="16" y="21" width="68" height="18" rx="9" fill="currentColor"/>
        <circle cx="17" cy="18" r="12" fill="currentColor"/>
        <circle cx="17" cy="42" r="12" fill="currentColor"/>
        <circle cx="83" cy="18" r="12" fill="currentColor"/>
        <circle cx="83" cy="42" r="12" fill="currentColor"/>
      </symbol>
    </svg>
    <svg class="decor p1" viewBox="0 0 100 100"><use href="#pawprint"/></svg>
    <svg class="decor p2" viewBox="0 0 100 100"><use href="#pawprint"/></svg>
    <svg class="decor p3" viewBox="0 0 100 100"><use href="#pawprint"/></svg>
    <svg class="decor p4" viewBox="0 0 100 100"><use href="#pawprint"/></svg>
    <svg class="decor bone" viewBox="0 0 100 60"><use href="#bone"/></svg>

    <div class="wrap">
      <div class="page-h">
        <h1 id="greetTitle">个人工作台</h1>
        <span class="sub" id="cntLine">按你的权限展示，点击进入无需再次登录</span>

      </div>

      <div class="banners" id="banners"></div>

      <div id="panels">
        <div class="card"><div class="agrid">
          <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
          <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        </div></div>

      <div class="pagefoot">吉信德集团 · 企业门户 🐾 portal.zestrade.com</div>
    </div>
  </div>
</div>

<script src="/icons.js"></script>
<script>
const API_BASE = '';
let allModules = [];
let favIds = [];        // 常用应用 id（用户自定义，服务端持久化）
let userName = '';

async function fetchJSON(url, options) {
  const resp = await fetch(API_BASE + url, {
    credentials: 'include',
    headers: options?.body ? { 'Content-Type': 'application/json' } : undefined,
    ...options,
  });
  if (!resp.ok) throw Object.assign(new Error('HTTP ' + resp.status), { status: resp.status });
  return resp.json();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ── 用户区：头像 + 下拉菜单 + 退出登录（接入规范固定件）── */
function renderUserArea(me) {
  const btn = document.getElementById('avatarBtn');
  const user = me?.user || {};
  const name = user.display_name || user.displayName || user.email || '未登录';
  userName = name === '未登录' ? '' : name;
  const avatarUrl = user.avatar || user.avatar_url || '';

  const setInitial = () => { btn.textContent = name === '未登录' ? '?' : name.slice(0, 1); };
  if (avatarUrl) {
    const img = new Image();
    img.src = avatarUrl;
    img.alt = name;
    img.onerror = setInitial;           // 图片加载失败兜底成文字头像
    img.onload = () => { btn.textContent = ''; btn.appendChild(img); };
  } else {
    setInitial();
  }

  document.getElementById('menuName').textContent = name;
  document.getElementById('menuEmail').textContent = user.email || '';
  document.getElementById('menuRoles').innerHTML =
    (me?.roles || []).map(r => `<span class="role-chip">${esc(r)}</span>`).join('');

  if ((me?.roles || []).includes('admin')) {
    document.getElementById('sideAdminLink').style.display = 'flex';
  }
}

const menu = document.getElementById('userMenu');
document.getElementById('avatarBtn').addEventListener('click', () => menu.classList.toggle('open'));
// 点击菜单外部自动收起（规范要求：capture 阶段 + composedPath 判断）
document.addEventListener('click', (e) => {
  if (!e.composedPath().includes(document.getElementById('userArea'))) {
    menu.classList.remove('open');
  }
}, true);

document.getElementById('logoutBtn').addEventListener('click', () => {
  window.location.assign(`${API_BASE}/logout?returnTo=${encodeURIComponent(window.location.href)}`);
});

/* ── 视图（hash 路由）：#workbench 个人工作台 / #apps 全部应用 ── */
function currentView() {
  return location.hash === '#apps' ? 'apps' : 'workbench';
}

const CAT_ORDER = ['电商运营', '供应链生产', '产品设计', '客户销售', '协同办公'];
const CAT_ICONS = {
  '电商运营': '<path d="M2 3h2l1.6 7.5h6.9L14 5H4.6"/><circle cx="6.6" cy="13" r="1.1"/><circle cx="11.4" cy="13" r="1.1"/>',
  '供应链生产': '<path d="M8 2l6 3v6l-6 3-6-3V5z"/><path d="M2 5l6 3 6-3M8 8v6"/>',
  '产品设计': '<path d="M11.3 2.7l2 2L5.6 12.4l-2.8.8.8-2.8zM10 4l2 2"/>',
  '客户销售': '<circle cx="6" cy="5.8" r="2.3"/><path d="M2 13.4c0-2.1 1.8-3.4 4-3.4s4 1.3 4 3.4"/><circle cx="11.6" cy="6.4" r="1.7"/><path d="M11.2 10.1c1.7.3 2.8 1.4 2.8 3"/>',
  '协同办公': '<rect x="2" y="3" width="12" height="8" rx="1.5"/><path d="M6 14h4M8 11v3"/>',
  '未分类':   '<path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3L8 5h4.5A1.5 1.5 0 0 1 14 6.5v5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"/>',
};
const GRID_ICON = '<rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/>';
const STAR_ICON = '<path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/>';
const GRADS = [
  'linear-gradient(140deg,#5793f8,#2e6ae8)',
  'linear-gradient(140deg,#43d492,#1fae6e)',
  'linear-gradient(140deg,#f9b04e,#f28c1c)',
  'linear-gradient(140deg,#a98cf8,#7e5ce8)',
  'linear-gradient(140deg,#f7c24b,#eda01f)',
  'linear-gradient(140deg,#f88a7a,#ee5a45)',
  'linear-gradient(140deg,#3fd0d9,#18a7b3)',
  'linear-gradient(140deg,#6f7ef5,#4653e0)',
];

function svg16(inner) {
  return `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}

/* 图标渐变按模块在 allModules 里的位次分配，跨视图保持稳定 */
function gradOf(m) {
  const i = allModules.findIndex(x => x.id === m.id);
  return GRADS[(i < 0 ? 0 : i) % GRADS.length];
}

/* 图标解析优先级：图片 URL > 内置图标名 > 旧数据 emoji/文本 > 模块名首字兜底 */
function iconContent(m, size) {
  const v = (m.icon || '').trim();
  if (/^https?:\/\//.test(v)) {
    return `<img src="${esc(v)}" alt="" onerror="this.style.display='none'">`;
  }
  const svg = window.portalIconSVG?.(v, size);
  if (svg) return svg;
  if (v) return esc(v);
  return esc((m.name || '?').slice(0, 1));
}

function tileHTML(m) {
  const icon = iconContent(m, 22);
  const faved = favIds.includes(m.id);
  const maint = m.status === 'maintenance' ? '<em class="maint">维护中</em>' : '';
  const owner = m.owner_name
    ? `<span class="owner-line">负责人：${esc(m.owner_name)}</span>` : '';
  return `<a class="acard" href="${esc(m.url)}" target="_blank" rel="noopener">
    <span class="ic" style="background:${gradOf(m)}">${icon}</span>
    <div><b>${esc(m.name)}${maint}</b><span>${esc(m.description)}</span>${owner}</div>
    <button class="fav-btn ${faved ? 'faved' : ''}" data-fav="${m.id}"
      title="${faved ? '取消常用' : '设为常用'}">${faved ? '★' : '☆'}</button>
    <span class="ar">→</span>
  </a>`;
}

/* ── 横幅公告（可关闭，关闭记录存本地）── */
let anns = [];
const dismissedAnns = new Set(JSON.parse(localStorage.getItem('dismissedAnns') || '[]'));

function renderBanners() {
  const show = anns.filter(a => !dismissedAnns.has(a.id));
  document.getElementById('banners').innerHTML = show.map(a => `
    <div class="banner ${a.level === 'warning' ? 'warning' : ''}">
      <span class="bic">${a.level === 'warning' ? '⚠️' : '📢'}</span>
      <span>${esc(a.content)}</span>
      <button class="bx" data-ann="${a.id}" title="关闭">✕</button>
    </div>`).join('');
}

document.getElementById('banners').addEventListener('click', (e) => {
  const btn = e.target.closest('.bx');
  if (!btn) return;
  dismissedAnns.add(Number(btn.dataset.ann));
  localStorage.setItem('dismissedAnns', JSON.stringify([...dismissedAnns]));
  renderBanners();
});

function cardHTML(iconInner, title, count, gridHTML) {
  return `<div class="card">
    <div class="card-h"><span class="hic">${svg16(iconInner)}</span>${title}<span class="ct">${count}</span></div>
    ${gridHTML}
  </div>`;
}

/* 个人工作台：我的常用应用（自定义）+ 全部应用 */
function renderWorkbench(list) {
  const favs = favIds.map(id => list.find(m => m.id === id)).filter(Boolean);
  const favGrid = favs.length
    ? `<div class="agrid">${favs.map(tileHTML).join('')}</div>`
    : `<div class="empty"><div class="big">☆</div>还没有常用应用<br>把鼠标移到下方应用卡片上，点右上角的星标即可添加</div>`;
  const allGrid = list.length
    ? `<div class="agrid">${list.map(tileHTML).join('')}</div>`
    : `<div class="empty"><div class="big">🐾</div>${allModules.length ? '没有匹配的应用' : '暂无可用应用，请联系管理员为你分配权限'}</div>`;
  document.getElementById('panels').innerHTML =
    cardHTML(STAR_ICON, '我的常用应用', favs.length ? `${favs.length} 个 · 点星标增减` : '自定义', favGrid) +
    cardHTML(GRID_ICON, '全部应用', `${list.length} 个`, allGrid);
}

/* 全部应用：按分类拆成悬浮模块卡（预置分类 → 其他分类 → 未分类） */
function renderApps(list) {
  const box = document.getElementById('panels');
  if (!list.length) {
    box.innerHTML = `<div class="card"><div class="empty"><div class="big">🐾</div>
      ${allModules.length ? '没有匹配的应用' : '暂无可用应用，请联系管理员为你分配权限'}</div></div>`;
    return;
  }
  const catOf = m => m.category || '未分类';
  const present = [...new Set(list.map(catOf))];
  const cats = [
    ...CAT_ORDER.filter(c => present.includes(c)),
    ...present.filter(c => !CAT_ORDER.includes(c) && c !== '未分类').sort(),
    ...(present.includes('未分类') ? ['未分类'] : []),
  ];
  box.innerHTML = cats.map(cat => {
    const mods = list.filter(m => catOf(m) === cat);
    return cardHTML(CAT_ICONS[cat] || CAT_ICONS['未分类'], esc(cat), `${mods.length} 个应用`,
      `<div class="agrid">${mods.map(tileHTML).join('')}</div>`);
  }).join('');
}

function render() {
  const view = currentView();
  document.getElementById('navWork').classList.toggle('on', view === 'workbench');
  document.getElementById('navApps').classList.toggle('on', view === 'apps');
  // 横幅公告只在个人工作台显示
  document.getElementById('banners').style.display = view === 'apps' ? 'none' : '';
  document.getElementById('allCt').textContent = allModules.length || '';
  const title = view === 'apps' ? '全部应用' : '个人工作台';
  document.getElementById('greetTitle').textContent =
    userName ? `${title} · 你好，${userName}` : title;

  const q = document.getElementById('q').value.trim().toLowerCase();
  let list = allModules;
  if (q) list = list.filter(m => (m.name + m.description).toLowerCase().includes(q));
  document.getElementById('cntLine').textContent =
    `共 ${list.length} 个应用 · 按你的权限展示，点击进入无需再次登录`;
  (view === 'apps' ? renderApps : renderWorkbench)(list);
}

/* 星标收藏：本地即时更新 + 服务端持久化（失败回滚） */
document.getElementById('panels').addEventListener('click', async (e) => {
  const btn = e.target.closest('.fav-btn');
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();
  const id = Number(btn.dataset.fav);
  const before = [...favIds];
  favIds = favIds.includes(id) ? favIds.filter(x => x !== id) : [...favIds, id];
  render();
  try {
    const data = await fetchJSON('/api/favorites', { method: 'PUT', body: JSON.stringify({ ids: favIds }) });
    favIds = data.ids;
  } catch {
    favIds = before;   // 保存失败回滚
    render();
  }
});

document.getElementById('q').addEventListener('input', render);
window.addEventListener('hashchange', render);

(async function init() {
  try {
    const me = await fetchJSON('/api/me');
    renderUserArea(me);
    const [mods, favs, annsResp] = await Promise.all([
      fetchJSON('/api/modules'),
      fetchJSON('/api/favorites').catch(() => ({ ids: [] })),
      fetchJSON('/api/announcements').catch(() => ({ announcements: [] })),
    ]);
    allModules = mods.modules;
    favIds = favs.ids;
    anns = annsResp.announcements;
    renderBanners();
    render();
  } catch (err) {
    renderUserArea(null);
    document.getElementById('panels').innerHTML =
      `<div class="card"><div class="empty"><div class="big">🔒</div>
       未登录或认证服务不可用（${esc(err.message)}）<br>
       正常情况下会先被统一登录页拦截，请检查部署链路或联系管理员</div></div>`;
  }
})();
</script>
</body>
