<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吉信德企业门户</title>
<link rel="stylesheet" href="/common.css">
<style>
  /* 页面特有样式；共用部分（变量/顶栏/用户区/侧边栏/卡片基础）见 common.css */
  .search {
    flex: 1; max-width: 560px; display: flex; align-items: center; gap: 10px;
    background: #fff; border-radius: 999px; padding: 11px 20px;
    box-shadow: 0 2px 10px rgba(61, 98, 176, .08);
  }
  .search input {
    flex: 1; border: none; outline: none; background: none; font-family: inherit;
    font-size: 15.5px; color: var(--ink);
  }
  .search input::placeholder { color: #9fadc4; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 22px; }

  /* 背景宠物元素：一串爪印从右上角"走进"页面 + 一根小骨头 */
  .decor { position: absolute; pointer-events: none; user-select: none; color: rgba(255, 255, 255, .62); z-index: 0; }
  /* 爪印从右上角走到标语"I share, enjoy and love."的左端，大致覆盖整条标语 */
  .decor.p1 { top: 8px;   right: 28px;  width: 30px; transform: rotate(-118deg); }
  .decor.p2 { top: 56px;  right: 100px; width: 27px; transform: rotate(-132deg); color: rgba(255, 255, 255, .55); }
  .decor.p3 { top: 20px;  right: 172px; width: 24px; transform: rotate(-115deg); color: rgba(255, 255, 255, .48); }
  .decor.p4 { top: 66px;  right: 248px; width: 21px; transform: rotate(-130deg); color: rgba(255, 255, 255, .4); }
  .decor.bone { top: 110px; right: 60px; width: 46px; transform: rotate(24deg); color: rgba(255, 255, 255, .45); }
  @media (max-width: 900px) { .decor { display: none; } }

  .wrap { position: relative; z-index: 1; }   /* 让内容压在爪印装饰之上 */
  .page-h { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 2px 4px 4px; }
  .page-h h1 { font-size: 23px; font-weight: 700; color: var(--ink-strong); }
  .page-h .sub { font-size: 14.5px; color: #5d6d8c; }

  /* 横幅公告条 */
  .banners { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .banner {
    display: flex; align-items: center; gap: 10px;
    background: #fff; border-left: 4px solid var(--blue); border-radius: 10px;
    padding: 11px 14px; font-size: 15px; color: #33425f;
    box-shadow: 0 2px 10px rgba(61, 98, 176, .08);
  }
  .banner.warning { border-left-color: #f5a623; }
  .banner .bic { flex: none; }
  .banner .bx {
    margin-left: auto; color: #9aa7c0; font-size: 17px; line-height: 1;
    padding: 2px 6px; border-radius: 6px; flex: none;
  }
  .banner .bx:hover { color: #e0455a; background: #fdeef0; }

  .card-h {
    display: flex; align-items: center; gap: 10px;
    padding: 18px 22px 4px; font-size: 17px; font-weight: 700; color: var(--ink-strong);
  }
  .card-h .hic {
    width: 24px; height: 24px; border-radius: 7px; flex: none;
    background: var(--blue-bg); color: var(--blue);
    display: grid; place-items: center;
  }
  .card-h .ct { font-size: 14px; color: var(--dim); font-weight: 400; }
  /* 分节标题：把"我的常用应用"卡与下方按分类拆开的"全部应用"隔开 */
  .sec-h {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 26px 4px 6px; font-size: 19px; font-weight: 700; color: var(--ink-strong);
  }
  .sec-h .hic {
    width: 26px; height: 26px; border-radius: 7px; flex: none;
    background: var(--blue); color: #fff; display: grid; place-items: center;
  }
  .sec-h .ct { font-size: 14.5px; color: var(--dim); font-weight: 400; }

  /* 应用磁贴：模块卡内的浅蓝底小卡 */
  .agrid {
    display: grid; gap: 13px; padding: 14px 22px 22px;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  }
  .acard {
    display: flex; align-items: center; gap: 14px; position: relative;
    background: #f4f8fd; border: 1px solid #eaf1fa; border-radius: 12px; padding: 17px 16px;
    transition: all .18s;
  }
  .acard:hover {
    background: #fff; transform: translateY(-3px); border-color: #c4d8f8;
    box-shadow: 0 12px 26px rgba(47, 110, 244, .14);
  }
  .acard .ic {
    width: 48px; height: 48px; border-radius: 13px; font-size: 25px; color: #fff;
    display: grid; place-items: center; flex: none;
  }
  .acard .ic img { width: 26px; height: 26px; object-fit: contain; }
  /* 名称与介绍都只占一行，超长截断显示省略号，悬停显示全文；卡片网格宽度不变 */
  .acard > div { flex: 1; min-width: 0; }
  .acard b { display: block; font-size: 16.5px; font-weight: 650; color: var(--ink-strong); padding-right: 20px;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acard span { display: block; font-size: 14px; color: var(--dim); margin-top: 5px; line-height: 1.5;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acard .maint {
    display: inline-block; font-style: normal; font-size: 12.5px; font-weight: 600;
    color: #c2701a; background: #fff3e0; border-radius: 999px; padding: 2px 8px;
    margin-left: 7px; vertical-align: 1px;
  }
  .acard .owner-line { font-size: 13px; color: #93a1bc; margin-top: 4px; }
  .acard .ar {
    position: absolute; right: 14px; bottom: 14px; transform: translateX(-4px);
    color: var(--blue); font-size: 17px; opacity: 0; transition: all .18s;
  }
  .acard:hover .ar { opacity: 1; transform: none; }
  /* 星标收藏：右上角，悬停或已收藏时可见 */
  .fav-btn {
    position: absolute; top: 8px; right: 10px; font-size: 17px; line-height: 1;
    color: #b8c5dc; opacity: 0; transition: all .15s; padding: 3px;
  }
  .acard:hover .fav-btn { opacity: 1; }
  .fav-btn:hover { transform: scale(1.25); color: var(--star); }
  .fav-btn.faved { opacity: 1; color: var(--star); }

  .empty { padding: 40px 0 46px; text-align: center; color: var(--dim); font-size: 15px; line-height: 1.8; }
  .empty .big { font-size: 38px; margin-bottom: 10px; }
  .empty .relogin { display: inline-block; padding: 8px 18px; border-radius: 8px; background: var(--blue, #2563eb); color: #fff; text-decoration: none; font-size: 15px; }

  /* 骨架屏 */
  .skeleton {
    height: 84px; border-radius: 12px; border: 1px solid #eaf1fa;
    background: linear-gradient(100deg, #f4f8fd 40%, #ecf2fa 50%, #f4f8fd 60%);
    background-size: 200% 100%; animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .pagefoot { text-align: center; font-size: 13.5px; color: #6d7d9c; padding: 26px 0 2px; letter-spacing: .06em; }
  .pagefoot .paw { width: 1em; height: 1em; vertical-align: -0.12em; margin: 0 2px; }
</style>
</head>
<body>
<header class="top">
  <div class="logo">
    <span class="mk">吉</span>
    <div><b>吉信德企业门户</b></div>
  </div>
  <div class="search">🔍<input id="q" placeholder="搜索应用名称…"></div>
  <div class="top-right">
    <div class="user-area" id="userArea">
      <button class="avatar-btn" id="avatarBtn" title="账户">…</button>
      <div class="user-menu" id="userMenu">
        <div class="who">
          <div class="name" id="menuName">识别中</div>
          <div class="email" id="menuEmail"></div>
          <div class="roles" id="menuRoles"></div>
        </div>
        <button class="menu-item" id="logoutBtn">退出登录</button>
      </div>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="side">
    <a class="nav on" id="navWork" href="/">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 7.5 8 2l6 5.5V14H2z"/><path d="M6 14v-4h4v4"/></svg>
      个人工作台
    </a>
    <a class="nav" id="sideAdminLink" href="/admin" style="display:none">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M13 8c0-.4 0-.8-.1-1.1l1.4-1-1.2-2.1-1.6.6c-.6-.5-1.2-.9-2-1.1L9.2 1.6H6.8l-.3 1.7c-.8.2-1.4.6-2 1.1l-1.6-.6-1.2 2.1 1.4 1c-.1.3-.1.7-.1 1.1s0 .8.1 1.1l-1.4 1 1.2 2.1 1.6-.6c.6.5 1.2.9 2 1.1l.3 1.7h2.4l.3-1.7c.8-.2 1.4-.6 2-1.1l1.6.6 1.2-2.1-1.4-1c.1-.3.1-.7.1-1.1z"/></svg>
      管理后台
    </a>
    <div class="side-card">
      <svg class="paw-bg" viewBox="0 0 100 100" aria-hidden="true"><use href="#pawprint"/></svg>
      <div class="t">没有你需要的应用？</div>
      <p>入口按你的权限展示，如需访问其他系统请联系管理员开通</p>
    </div>
  </aside>

  <div class="main">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="pawprint" viewBox="0 0 100 100">
        <ellipse cx="50" cy="66" rx="21" ry="16" fill="currentColor"/>
        <ellipse cx="25" cy="40" rx="8.5" ry="11" fill="currentColor" transform="rotate(-22 25 40)"/>
        <ellipse cx="42" cy="30" rx="8.5" ry="11" fill="currentColor" transform="rotate(-7 42 30)"/>
        <ellipse cx="59" cy="30" rx="8.5" ry="11" fill="currentColor" transform="rotate(8 59 30)"/>
        <ellipse cx="76" cy="41" rx="8.5" ry="11" fill="currentColor" transform="rotate(24 76 41)"/>
      </symbol>
      <symbol id="bone" viewBox="0 0 100 60">
        <rect x="16" y="21" width="68" height="18" rx="9" fill="currentColor"/>
        <circle cx="17" cy="18" r="12" fill="currentColor"/>
        <circle cx="17" cy="42" r="12" fill="currentColor"/>
        <circle cx="83" cy="18" r="12" fill="currentColor"/>
        <circle cx="83" cy="42" r="12" fill="currentColor"/>
      </symbol>
    </svg>
    <svg class="decor p1" viewBox="0 0 100 100"><use href="#pawprint"/></svg>
    <svg class="decor p2" viewBox="0 0 100 100"><use href="#pawprint"/></svg>
    <svg class="decor p3" viewBox="0 0 100 100"><use href="#pawprint"/></svg>
    <svg class="decor p4" viewBox="0 0 100 100"><use href="#pawprint"/></svg>
    <svg class="decor bone" viewBox="0 0 100 60"><use href="#bone"/></svg>

    <div class="wrap">
      <div class="page-h">
        <h1 id="greetTitle">个人工作台</h1>
      </div>

      <div class="banners" id="banners"></div>

      <div id="panels">
        <div class="card"><div class="agrid">
          <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
          <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        </div></div>
      </div>

      <div class="pagefoot">厦门吉信德集团有限公司 · 企业门户 <svg class="paw" viewBox="0 0 100 100" aria-hidden="true"><use href="#pawprint"/></svg> portal.zestrade.com</div>
    </div>
  </div>
</div>

<script src="/icons.js"></script>
<script src="/common.js"></script>
<script>
let allModules = [];
let favIds = [];        // 常用应用 id（用户自定义，服务端持久化）
let userName = '';

/* ── 分类块顺序：管理后台配置的在前（/api/modules 的 category_order），
   其余按分类名拼音（浏览器中文排序规则），"未分类"永远最后 ── */
let categoryOrder = [];
const zhCollator = new Intl.Collator('zh-Hans-CN');

function sortedCategories(present) {
  const configured = categoryOrder.filter(c => present.includes(c));
  const rest = present.filter(c => !configured.includes(c) && c !== '未分类').sort(zhCollator.compare);
  return [...configured, ...rest, ...(present.includes('未分类') ? ['未分类'] : [])];
}

const CAT_ICONS = {
  '电商运营': '<path d="M2 3h2l1.6 7.5h6.9L14 5H4.6"/><circle cx="6.6" cy="13" r="1.1"/><circle cx="11.4" cy="13" r="1.1"/>',
  '供应链生产': '<path d="M8 2l6 3v6l-6 3-6-3V5z"/><path d="M2 5l6 3 6-3M8 8v6"/>',
  '产品设计': '<path d="M11.3 2.7l2 2L5.6 12.4l-2.8.8.8-2.8zM10 4l2 2"/>',
  '客户销售': '<circle cx="6" cy="5.8" r="2.3"/><path d="M2 13.4c0-2.1 1.8-3.4 4-3.4s4 1.3 4 3.4"/><circle cx="11.6" cy="6.4" r="1.7"/><path d="M11.2 10.1c1.7.3 2.8 1.4 2.8 3"/>',
  '协同办公': '<rect x="2" y="3" width="12" height="8" rx="1.5"/><path d="M6 14h4M8 11v3"/>',
  '未分类':   '<path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3L8 5h4.5A1.5 1.5 0 0 1 14 6.5v5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"/>',
};
const GRID_ICON = '<rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/>';
const STAR_ICON = '<path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/>';
function svg16(inner) {
  return `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}

let categoryColors = {};   // 分类底色（/api/modules 的 category_colors），同分类同色

function tileHTML(m) {
  const faved = favIds.includes(m.id);
  const maint = m.status === 'maintenance' ? '<em class="maint">维护中</em>' : '';
  const owner = m.owner_name
    ? `<span class="owner-line">负责人：${esc(m.owner_name)}</span>` : '';
  return `<a class="acard" href="${esc(m.url)}" target="_blank" rel="noopener">
    ${badgeHTML(m, categoryColors, 48)}
    <div><b title="${esc(m.name)}">${esc(m.name)}${maint}</b><span title="${esc(m.description)}">${esc(m.description)}</span>${owner}</div>
    <button class="fav-btn ${faved ? 'faved' : ''}" data-fav="${m.id}"
      title="${faved ? '取消常用' : '设为常用'}">${faved ? '★' : '☆'}</button>
    <span class="ar">→</span>
  </a>`;
}

/* ── 横幅公告（可关闭，关闭记录存本地）── */
let anns = [];
const dismissedAnns = new Set(JSON.parse(localStorage.getItem('dismissedAnns') || '[]'));

function renderBanners() {
  const show = anns.filter(a => !dismissedAnns.has(a.id));
  document.getElementById('banners').innerHTML = show.map(a => `
    <div class="banner ${a.level === 'warning' ? 'warning' : ''}">
      <span class="bic">${a.level === 'warning' ? '⚠️' : '📢'}</span>
      <span>${esc(a.content)}</span>
      <button class="bx" data-ann="${a.id}" title="关闭">✕</button>
    </div>`).join('');
}

document.getElementById('banners').addEventListener('click', (e) => {
  const btn = e.target.closest('.bx');
  if (!btn) return;
  dismissedAnns.add(Number(btn.dataset.ann));
  localStorage.setItem('dismissedAnns', JSON.stringify([...dismissedAnns]));
  renderBanners();
});

function cardHTML(iconInner, title, count, gridHTML) {
  return `<div class="card">
    <div class="card-h"><span class="hic">${svg16(iconInner)}</span>${title}<span class="ct">${count}</span></div>
    ${gridHTML}
  </div>`;
}

/* 个人工作台：我的常用应用（自定义）+ 按分类拆成的悬浮模块卡 */
function renderWorkbench(list) {
  const favs = favIds.map(id => list.find(m => m.id === id)).filter(Boolean);
  const favGrid = favs.length
    ? `<div class="agrid">${favs.map(tileHTML).join('')}</div>`
    : `<div class="empty"><div class="big">☆</div>还没有常用应用<br>把鼠标移到下方应用卡片上，点右上角的星标即可添加</div>`;
  let catCards;
  if (!list.length) {
    catCards = `<div class="card"><div class="empty"><div class="big">🐾</div>
      ${allModules.length ? '没有匹配的应用' : '暂无可用应用，请联系管理员为你分配权限'}</div></div>`;
  } else {
    const catOf = m => m.category || '未分类';
    const cats = sortedCategories([...new Set(list.map(catOf))]);
    catCards = cats.map(cat => {
      const mods = list.filter(m => catOf(m) === cat);
      return cardHTML(CAT_ICONS[cat] || CAT_ICONS['未分类'], esc(cat), `${mods.length} 个应用`,
        `<div class="agrid">${mods.map(tileHTML).join('')}</div>`);
    }).join('');
  }
  const secHead = `<div class="sec-h"><span class="hic">${svg16(GRID_ICON)}</span>全部应用
    <span class="ct">共 ${list.length} 个应用 · 按你的权限分类展示</span></div>`;
  document.getElementById('panels').innerHTML =
    cardHTML(STAR_ICON, '我的常用应用', favs.length ? `${favs.length} 个 · 点星标增减` : '自定义', favGrid) +
    secHead + catCards;
}

function render() {
  document.getElementById('greetTitle').textContent =
    userName ? `个人工作台 · 你好，${userName}` : '个人工作台';
  const q = document.getElementById('q').value.trim().toLowerCase();
  let list = allModules;
  if (q) list = list.filter(m => (m.name + m.description + (m.category || '')).toLowerCase().includes(q));
  renderWorkbench(list);
}

/* 星标收藏：本地即时更新 + 服务端持久化（失败回滚） */
document.getElementById('panels').addEventListener('click', async (e) => {
  const btn = e.target.closest('.fav-btn');
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();
  const id = Number(btn.dataset.fav);
  const before = [...favIds];
  favIds = favIds.includes(id) ? favIds.filter(x => x !== id) : [...favIds, id];
  render();
  try {
    const data = await fetchJSON('/api/favorites', { method: 'PUT', body: JSON.stringify({ ids: favIds }) });
    favIds = data.ids;
  } catch {
    favIds = before;   // 保存失败回滚
    render();
  }
});

document.getElementById('q').addEventListener('input', render);

(async function init() {
  try {
    const me = await fetchJSON('/api/me');
    userName = renderUserArea(me);
    if (hasPerm(me?.permissions || [], PORTAL_MANAGE_PERMISSION)) {
      document.getElementById('sideAdminLink').style.display = 'flex';
    }
    const [mods, favs, annsResp] = await Promise.all([
      fetchJSON('/api/modules'),
      fetchJSON('/api/favorites').catch(() => ({ ids: [] })),
      fetchJSON('/api/announcements').catch(() => ({ announcements: [] })),
    ]);
    allModules = mods.modules;
    categoryOrder = mods.category_order || [];
    categoryColors = mods.category_colors || {};
    favIds = favs.ids;
    anns = annsResp.announcements;
    renderBanners();
    render();
  } catch (err) {
    renderUserArea(null);
    const relogin = err.status === 401
      ? `<p style="margin-top:14px"><a class="relogin" href="${esc(reloginUrl())}">重新登录</a></p>`
      : '';
    document.getElementById('panels').innerHTML =
      `<div class="card"><div class="empty"><div class="big">🔒</div>
       未登录或认证服务不可用（${esc(err.message)}）<br>
       正常情况下会先被统一登录页拦截，请检查部署链路或联系管理员${relogin}</div></div>`;
  }
})();
</script>
</body>
</html>
