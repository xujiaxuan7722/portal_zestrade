<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模块管理 · 吉信德企业门户</title>
<style>
  :root {
    --blue: #2f6ef4;
    --blue-dk: #2559cf;
    --blue-bg: #e8f1fd;
    --ink: #2a3a5c;
    --ink-strong: #1d2f4e;
    --dim: #8290a8;
    --bg: #eef3f9;
    --side-bg: #ffffff;
    --ok: #00b578;
    --ok-bg: #e6f8f1;
    --danger: #f53f3f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; cursor: pointer; }
  svg { flex: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ── 白色通栏顶栏 ── */
  .top {
    background: #fff; height: 64px; display: flex; align-items: center; gap: 26px;
    padding: 0 26px; position: sticky; top: 0; z-index: 30;
    border-bottom: 1px solid #eaf0f8;
  }
  .logo { display: flex; align-items: center; gap: 11px; flex: none; }
  .logo .mk {
    width: 40px; height: 40px; border-radius: 11px; color: #fff; font-size: 19px; font-weight: 800;
    background: linear-gradient(140deg, #5793f8, #2e6ae8); display: grid; place-items: center;
  }
  .logo b { font-size: 17px; letter-spacing: .02em; color: var(--ink-strong); }
  .logo small { display: block; font-size: 10.5px; color: var(--dim); letter-spacing: .12em; margin-top: 2px; font-weight: 400; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 22px; }
  .whoami { font-size: 13px; color: var(--dim); }
  .top-act {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10.5px; color: #5c6b88; transition: color .15s; background: none; border: none;
  }
  .top-act:hover { color: var(--blue); }

  /* ── 侧边栏 + 内容 ── */
  .layout { display: flex; min-height: calc(100vh - 64px); }
  .side {
    width: 196px; flex: none; background: var(--side-bg);
    border-right: 1px solid #eaf0f8;
    padding: 14px 12px 20px; display: flex; flex-direction: column; gap: 3px;
    position: sticky; top: 64px; height: calc(100vh - 64px); overflow-y: auto;
  }
  .nav {
    display: flex; align-items: center; gap: 11px; padding: 12px 14px; border-radius: 10px;
    font-size: 14px; color: #3d4d70; transition: all .15s; position: relative;
    width: 100%; text-align: left; background: none; border: none;
  }
  .nav:hover { color: var(--blue); background: #f4f8fe; }
  .nav.on { background: var(--blue-bg); color: var(--blue); font-weight: 600; }
  .nav.on::after {
    content: ""; position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
    border: 4.5px solid transparent; border-right: 6px solid var(--blue);
  }
  .side-card {
    margin-top: auto; border-radius: 12px; padding: 15px 14px; position: relative; overflow: hidden;
    background: linear-gradient(145deg, #4a8cf5 0%, #2e63e2 100%); color: #fff;
  }
  .side-card::after {
    content: "🛡️"; position: absolute; right: -6px; bottom: -10px; font-size: 54px; opacity: .22;
  }
  .side-card .t { font-size: 13px; font-weight: 650; position: relative; }
  .side-card p { font-size: 11.5px; opacity: .88; margin-top: 7px; line-height: 1.6; position: relative; }

  .main { flex: 1; min-width: 0; }
  .wrap { padding: 20px 24px 30px; }
  .page-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .page-head h1 { font-size: 20px; font-weight: 700; color: var(--ink-strong); }
  .page-head p { color: var(--dim); font-size: 12.5px; margin-top: 6px; }
  .actions { display: flex; gap: 10px; }

  .btn {
    padding: 9px 18px; border-radius: 999px; border: 1px solid #dde5f1;
    background: #fff; color: var(--ink); font-size: 13px; font-family: inherit; transition: all .18s;
  }
  .btn:hover { border-color: var(--blue); color: var(--blue); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--blue-dk); color: #fff; }
  .btn.save-order { background: var(--ok-bg); border-color: #b5e8d2; color: var(--ok); display: none; }
  .btn.save-order.dirty { display: inline-block; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(0, 181, 120, 0.12); } }

  .card {
    margin-top: 16px; background: #fff; border-radius: 12px;
    box-shadow: 0 2px 12px rgba(58, 110, 190, .05);
  }
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11.5px; color: #8a99b3; font-weight: 500;
       background: #f6f9fc; padding: 10px 14px; white-space: nowrap; }
  td { padding: 13px 14px; font-size: 13px; border-top: 1px solid #f2f5fa; vertical-align: middle; }
  tr.row { transition: background .15s; background: #fff; }
  tr.row:hover { background: #f8fbff; }
  tr.row.dragging { opacity: .4; }
  tr.row.drag-over td { border-top: 2px solid var(--blue); }
  .drag-handle { cursor: grab; color: #a4b0c8; user-select: none; font-size: 15px; padding: 4px; }
  .mod-icon { font-size: 20px; }
  .mod-icon img { width: 22px; height: 22px; object-fit: contain; vertical-align: middle; }
  .mod-name { font-weight: 600; color: var(--ink-strong); }
  .mod-url { color: var(--dim); font-size: 12px; max-width: 220px; overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; }
  .chip {
    display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 4px; margin: 2px 3px 2px 0;
    background: var(--blue-bg); color: var(--blue); font-weight: 600;
  }
  .chip.all { background: var(--ok-bg); color: var(--ok); }
  .status-dot { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ok); }
  .status-dot::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .status-dot.off { color: var(--dim); }
  .status-dot.off::before { background: #b3bfd4; }
  .row-btn { background: none; border: none; font-size: 12.5px; padding: 5px 8px;
             border-radius: 6px; color: var(--blue); font-family: inherit; }
  .row-btn:hover { background: var(--blue-bg); }
  .row-btn.del { color: var(--danger); }
  .row-btn.del:hover { background: #fdeef0; }

  /* 弹窗 */
  .overlay { position: fixed; inset: 0; background: rgba(29, 47, 78, 0.4);
             display: none; place-items: center; z-index: 200; padding: 20px; }
  .overlay.open { display: grid; }
  .modal { width: min(520px, calc(100vw - 40px)); max-height: 88vh; overflow-y: auto;
           background: #fff; border-radius: 12px; padding: 26px;
           box-shadow: 0 24px 60px rgba(29, 47, 78, .28); }
  .modal h2 { font-size: 17px; margin-bottom: 20px; color: var(--ink-strong); }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: #45557a; margin-bottom: 7px; }
  .field input[type="text"], .field textarea {
    width: 100%; padding: 10px 12px; border-radius: 8px; font-size: 13px; font-family: inherit;
    background: #fff; border: 1px solid #dde5f1; color: var(--ink);
  }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--blue); }
  .field .hint { font-size: 11px; color: var(--dim); margin-top: 5px; }
  .roles-box { display: flex; flex-wrap: wrap; gap: 8px; }
  .role-check { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
                padding: 6px 13px; border-radius: 6px; cursor: pointer;
                background: #f1f5fa; border: 1px solid transparent; color: #45557a; }
  .role-check:has(input:checked) { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); font-weight: 600; }
  .role-check input { accent-color: var(--blue); }
  .role-del { background: none; border: none; color: #a4b0c8; font-size: 14px;
              padding: 0 0 0 2px; line-height: 1; cursor: pointer; }
  .role-del:hover { color: var(--danger); }
  .add-role { display: flex; gap: 8px; margin-top: 10px; }
  .add-role input { flex: 1; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-family: inherit;
                    background: #fff; border: 1px solid #dde5f1; color: var(--ink); }
  .add-role input:focus { outline: none; border-color: var(--blue); }
  .switch-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }

  /* 提示 toast / 403 */
  #toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
           background: var(--ink-strong); color: #fff;
           padding: 11px 22px; border-radius: 999px; font-size: 13px; transition: transform .25s; z-index: 300; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  .forbidden { text-align: center; margin: 100px auto; color: var(--dim); }
  .forbidden .big { font-size: 44px; margin-bottom: 16px; }
  .forbidden a { color: var(--blue); }

  @media (max-width: 780px) {
    .side { display: none; }
    .top { padding: 0 14px; gap: 14px; }
    .logo small { display: none; }
    .wrap { padding: 16px 14px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="logo">
    <span class="mk">吉</span>
    <div><b>吉信德企业门户</b><small>门户管理后台</small></div>
  </div>
  <div class="top-right">
    <span class="whoami" id="whoami"></span>
    <a class="top-act" href="/">
      <svg width="19" height="19" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 3 2.5 8 7 13M2.5 8H14"/></svg>
      返回门户
    </a>
  </div>
</header>

<div class="layout" id="main" hidden>
  <aside class="side">
    <span class="nav on">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
      应用模块管理
    </span>
    <a class="nav" href="/">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 3 2.5 8 7 13M2.5 8H14"/></svg>
      返回门户首页
    </a>
    <div class="side-card">
      <div class="t">角色可见性说明</div>
      <p>模块的可见角色留空 = 全员可见；角色数据来自 RBAC 角色池，员工端按角色实时过滤</p>
    </div>
  </aside>

  <div class="main">
    <div class="wrap">
      <div class="page-head">
        <div>
          <h1>展示模块管理</h1>
          <p>增删改模块、拖拽排序、配置角色可见性。"可见角色"为空 = 所有人可见。</p>
        </div>
        <div class="actions">
          <button class="btn save-order" id="saveOrderBtn">保存排序</button>
          <button class="btn primary" id="addBtn">＋ 新增模块</button>
        </div>
      </div>

      <div class="card">
        <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:36px"></th><th style="width:44px">图标</th><th>名称 / 描述</th>
              <th style="width:100px">分类</th>
              <th>跳转地址</th><th>可见角色</th><th style="width:70px">状态</th><th style="width:110px">操作</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        </div>
      </div>

      <div style="text-align:center;font-size:11.5px;color:#a9b6cc;padding:26px 0 2px">
        吉信德集团 · 企业门户 · portal.zestrade.com/admin
      </div>
    </div>
  </div>
</div>

<div class="forbidden" id="forbidden" hidden>
  <div class="big">🚫</div>
  <p>你没有管理员权限，无法访问此页面</p>
  <p style="margin-top:10px"><a href="/">返回门户首页</a></p>
</div>

<!-- 新增/编辑弹窗 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">新增模块</h2>
    <div class="field">
      <label>模块名称 *</label>
      <input type="text" id="fName" maxlength="50" placeholder="例如：领星 ERP">
    </div>
    <div class="field">
      <label>描述</label>
      <textarea id="fDesc" rows="2" maxlength="200" placeholder="一句话说明该系统的用途"></textarea>
    </div>
    <div class="field">
      <label>图标</label>
      <input type="text" id="fIcon" placeholder="一个 emoji（如 📊）或图片 URL">
    </div>
    <div class="field">
      <label>分类</label>
      <input type="text" id="fCat" list="catList" maxlength="50" placeholder="选择或输入分类，留空归入“未分类”">
      <datalist id="catList">
        <option>电商运营</option><option>供应链生产</option><option>产品设计</option>
        <option>客户销售</option><option>协同办公</option>
      </datalist>
      <div class="hint">门户首页侧边栏按分类分组展示</div>
    </div>
    <div class="field">
      <label>跳转地址 *</label>
      <input type="text" id="fUrl" placeholder="https://...">
    </div>
    <div class="field">
      <label>可见角色（不选 = 所有人可见）</label>
      <div class="roles-box" id="rolesBox"></div>
      <div class="add-role">
        <input type="text" id="newRoleInput" placeholder="角色名需与 RBAC 中登记的完全一致">
        <button class="btn" id="addRoleBtn">添加角色</button>
      </div>
      <div class="hint">下拉角色池 = 登录用户自动收录 + 手动添加；RBAC 提供角色接口后可切换为动态拉取</div>
    </div>
    <div class="field switch-row">
      <input type="checkbox" id="fEnabled" checked style="accent-color:var(--blue);width:16px;height:16px">
      <label for="fEnabled" style="margin:0;color:var(--ink);font-size:13px">启用（关闭后所有人不可见）</label>
    </div>
    <div class="modal-actions">
      <button class="btn" id="cancelBtn">取消</button>
      <button class="btn primary" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API_BASE = '';
let modules = [];
let knownRoles = [];
let editingId = null;   // null = 新增
let orderDirty = false;

async function fetchJSON(url, options) {
  const resp = await fetch(API_BASE + url, {
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  if (!resp.ok) {
    let detail = null;
    try { detail = (await resp.json()).detail; } catch {}
    throw Object.assign(new Error('HTTP ' + resp.status), { status: resp.status, detail });
  }
  return resp.json();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ── 列表渲染 + 拖拽排序 ── */
function renderTable() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = modules.map(m => {
    const icon = /^https?:\/\//.test(m.icon)
      ? `<img src="${esc(m.icon)}" alt="" onerror="this.style.display='none'">` : esc(m.icon || '📦');
    const roles = m.visible_roles.length
      ? m.visible_roles.map(r => `<span class="chip">${esc(r)}</span>`).join('')
      : '<span class="chip all">所有人</span>';
    return `<tr class="row" draggable="true" data-id="${m.id}">
      <td><span class="drag-handle" title="拖拽排序">⠿</span></td>
      <td class="mod-icon">${icon}</td>
      <td><div class="mod-name">${esc(m.name)}</div>
          <div style="color:var(--dim);font-size:12px;margin-top:3px">${esc(m.description)}</div></td>
      <td>${m.category ? `<span class="chip">${esc(m.category)}</span>`
                       : '<span style="color:var(--dim);font-size:12px">未分类</span>'}</td>
      <td><div class="mod-url" title="${esc(m.url)}">${esc(m.url)}</div></td>
      <td>${roles}</td>
      <td><span class="status-dot ${m.enabled ? '' : 'off'}">${m.enabled ? '启用' : '停用'}</span></td>
      <td><button class="row-btn" onclick="openEdit(${m.id})">编辑</button>
          <button class="row-btn del" onclick="removeModule(${m.id})">删除</button></td>
    </tr>`;
  }).join('');
  bindDrag();
}

let dragRow = null;
function bindDrag() {
  document.querySelectorAll('tr.row').forEach(row => {
    row.addEventListener('dragstart', () => { dragRow = row; row.classList.add('dragging'); });
    row.addEventListener('dragend', () => { dragRow?.classList.remove('dragging'); dragRow = null; });
    row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('drag-over'); });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', e => {
      e.preventDefault();
      row.classList.remove('drag-over');
      if (!dragRow || dragRow === row) return;
      row.parentNode.insertBefore(dragRow, row);
      markOrderDirty();
    });
  });
}

function markOrderDirty() {
  orderDirty = true;
  document.getElementById('saveOrderBtn').classList.add('dirty');
}

document.getElementById('saveOrderBtn').addEventListener('click', async () => {
  const ids = [...document.querySelectorAll('tr.row')].map(r => Number(r.dataset.id));
  try {
    await fetchJSON('/api/admin/modules/reorder', { method: 'PUT', body: JSON.stringify({ ids }) });
    orderDirty = false;
    document.getElementById('saveOrderBtn').classList.remove('dirty');
    await loadModules();
    toast('排序已保存');
  } catch (e) { toast('保存排序失败：' + e.message); }
});

/* ── 新增 / 编辑弹窗 ── */
function renderRoleChecks(selected) {
  const box = document.getElementById('rolesBox');
  box.innerHTML = knownRoles.map(r => `
    <label class="role-check">
      <input type="checkbox" value="${esc(r.name)}" ${selected.includes(r.name) ? 'checked' : ''}>
      ${esc(r.name)}
      <button type="button" class="role-del" data-role="${esc(r.name)}" title="从角色池删除">×</button>
    </label>`).join('') || '<span style="font-size:12px;color:var(--dim)">角色池为空，请在下方手动添加</span>';
}

/* 从角色池删除：仍被模块引用时后端返回 409 + 引用清单，确认后 force 联动移除 */
document.getElementById('rolesBox').addEventListener('click', (e) => {
  const btn = e.target.closest('.role-del');
  if (!btn) return;
  e.preventDefault();               // 阻止 label 联动切换 checkbox
  deleteRoleFromPool(btn.dataset.role);
});

async function deleteRoleFromPool(name) {
  const doDelete = (force) => fetchJSON(
    `/api/admin/roles/${encodeURIComponent(name)}${force ? '?force=true' : ''}`,
    { method: 'DELETE' });
  try {
    let data;
    try {
      data = await doDelete(false);
    } catch (err) {
      const used = err.status === 409 && err.detail?.modules;
      if (!used) throw err;
      if (!confirm(`角色「${name}」仍被以下模块使用：\n${used.join('、')}\n\n` +
                   '继续删除将同时把它从这些模块的"可见角色"中移除。确定？')) return;
      data = await doDelete(true);
      await loadModules();          // 模块的可见角色已被联动修改，刷新列表
    }
    const checked = [...document.querySelectorAll('#rolesBox input:checked')]
      .map(i => i.value).filter(v => v !== name);
    knownRoles = data.roles;
    renderRoleChecks(checked);
    toast(`已删除角色「${name}」`);
  } catch (e2) { toast('删除角色失败：' + e2.message); }
}

function openModal(title, m) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('fName').value = m?.name || '';
  document.getElementById('fDesc').value = m?.description || '';
  document.getElementById('fIcon').value = m?.icon || '';
  document.getElementById('fCat').value = m?.category || '';
  document.getElementById('fUrl').value = m?.url || '';
  document.getElementById('fEnabled').checked = m ? m.enabled : true;
  renderRoleChecks(m?.visible_roles || []);
  document.getElementById('overlay').classList.add('open');
}

window.openEdit = (id) => {
  editingId = id;
  openModal('编辑模块', modules.find(m => m.id === id));
};

document.getElementById('addBtn').addEventListener('click', () => {
  editingId = null;
  openModal('新增模块', null);
});
document.getElementById('cancelBtn').addEventListener('click', () =>
  document.getElementById('overlay').classList.remove('open'));

document.getElementById('addRoleBtn').addEventListener('click', async () => {
  const input = document.getElementById('newRoleInput');
  const name = input.value.trim();
  if (!name) return;
  try {
    const data = await fetchJSON('/api/admin/roles', { method: 'POST', body: JSON.stringify({ name }) });
    knownRoles = data.roles;
    const checked = [...document.querySelectorAll('#rolesBox input:checked')].map(i => i.value);
    renderRoleChecks([...checked, name]);
    input.value = '';
  } catch (e) { toast('添加角色失败：' + e.message); }
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  const body = {
    name: document.getElementById('fName').value.trim(),
    description: document.getElementById('fDesc').value.trim(),
    icon: document.getElementById('fIcon').value.trim() || '📦',
    category: document.getElementById('fCat').value.trim(),
    url: document.getElementById('fUrl').value.trim(),
    visible_roles: [...document.querySelectorAll('#rolesBox input:checked')].map(i => i.value),
    enabled: document.getElementById('fEnabled').checked,
  };
  if (!body.name || !body.url) { toast('名称和跳转地址不能为空'); return; }
  try {
    if (editingId === null) {
      await fetchJSON('/api/admin/modules', { method: 'POST', body: JSON.stringify(body) });
    } else {
      await fetchJSON(`/api/admin/modules/${editingId}`, { method: 'PUT', body: JSON.stringify(body) });
    }
    document.getElementById('overlay').classList.remove('open');
    await loadModules();
    toast('已保存');
  } catch (e) { toast('保存失败：' + e.message); }
});

window.removeModule = async (id) => {
  const m = modules.find(x => x.id === id);
  if (!confirm(`确定删除模块「${m?.name}」？此操作不可恢复。`)) return;
  try {
    await fetchJSON(`/api/admin/modules/${id}`, { method: 'DELETE' });
    await loadModules();
    toast('已删除');
  } catch (e) { toast('删除失败：' + e.message); }
};

/* ── 初始化 ── */
async function loadModules() {
  modules = (await fetchJSON('/api/admin/modules')).modules;
  renderTable();
}

(async function init() {
  try {
    const me = await fetchJSON('/api/me');
    if (!(me.roles || []).includes('admin')) throw Object.assign(new Error('forbidden'), { status: 403 });
    document.getElementById('whoami').textContent =
      `${me.user?.display_name || me.user?.email || ''} · admin`;
    knownRoles = (await fetchJSON('/api/admin/roles')).roles;
    await loadModules();
    document.getElementById('main').hidden = false;
  } catch (err) {
    // 后端接口本身也有 require_role("admin")，这里只是给个友好页面
    document.getElementById('forbidden').hidden = false;
  }
})();
</script>
</body>
</html>
